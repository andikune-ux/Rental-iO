name: Rental.iO Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Keystore decoded successfully to app/release.keystore"
          else
            echo "Warning: KEYSTORE_BASE64 secret not found. Generating fallback release keystore."
            keytool -genkey -v -keystore app/release.keystore -alias andikune -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass andikune -keypass andikune -dname "CN=Andi Kune, OU=RentalIO, O=Andikune UX, L=Jakarta, C=ID"
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Release APK
        env:
          KEYSTORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'andikune' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'andikune' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'andikune' }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Locate & Rename Release APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output_apk/Rental.iO-release.apk \;
          echo "Generated APK: output_apk/Rental.iO-release.apk"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output_apk/Rental.iO-release.apk
          name: "Rental.iO ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rental.iO-release-apk
          path: output_apk/Rental.iO-release.apk
