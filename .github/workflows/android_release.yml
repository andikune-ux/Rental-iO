name: Rental.iO Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -di > release.keystore || true
          fi
          if [ ! -s release.keystore ]; then
            echo "Generating official 'andikune' release keystore..."
            keytool -genkey -v -keystore release.keystore -alias andikune -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass andikune -keypass andikune -dname "CN=Andi Kune, OU=RentalIO, O=Andikune UX, L=Jakarta, C=ID"
          fi
          cp release.keystore app/release.keystore
          echo "Keystore successfully prepared:"
          ls -la release.keystore app/release.keystore

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'andikune' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'andikune' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'andikune' }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate & Rename Release APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output_apk/Rental.iO-release.apk \;
          echo "Generated APK:"
          ls -lh output_apk/Rental.iO-release.apk

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: output_apk/Rental.iO-release.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Rental.iO Release"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rental.iO-release-apk
          path: output_apk/Rental.iO-release.apk
