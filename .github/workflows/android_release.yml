name: Rental.iO Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.1.0 or leave empty for auto v1.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: release_info
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            TAG="${{ inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Release for Tag: $TAG (VersionName: $VERSION, VersionCode: ${{ github.run_number }})"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'gradle'

      - name: Setup Android SDK Environment & Permissions
        run: |
          echo "ANDROID_HOME is located at: $ANDROID_HOME"
          sudo chown -R $USER:$USER $ANDROID_HOME 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Ensure Environment Configuration Files Exist
        run: |
          touch .env.example
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Verify Permanent Release Keystore
        run: |
          mkdir -p app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from secret KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          elif [ -n "${{ secrets.ANDIKUNE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from secret ANDIKUNE_KEYSTORE_BASE64..."
            echo "${{ secrets.ANDIKUNE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          elif [ -f "app/andikune-release.jks" ]; then
            echo "Using permanent app/andikune-release.jks from repository..."
            cp app/andikune-release.jks app/release.keystore
          elif [ -f "release.keystore" ]; then
            echo "Using permanent root release.keystore..."
            cp release.keystore app/release.keystore
          else
            echo "::error ::Permanent release keystore not found! Refusing to build with a temporary keystore to avoid signature mismatch on user app updates."
            exit 1
          fi

          echo "Verifying permanent keystore integrity..."
          keytool -list -v -keystore app/release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD || secrets.ANDIKUNE_STORE_PASSWORD || 'andikune' }}" | grep -E "Alias name|SHA256" || true
          echo "Keystore verified successfully."

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_FILE: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDIKUNE_STORE_PASSWORD || 'andikune' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDIKUNE_KEY_ALIAS || 'andikune' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDIKUNE_KEY_PASSWORD || 'andikune' }}
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate & Prepare Release APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output_apk/Rental.iO-release.apk \;
          echo "Generated APK file:"
          ls -lh output_apk/Rental.iO-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rental.iO-release-apk
          path: output_apk/Rental.iO-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/Rental.iO-release.apk
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Rental.iO Release ${{ steps.release_info.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
